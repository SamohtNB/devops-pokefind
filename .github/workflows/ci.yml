name: CI

on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.16-dind
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest fastapi uvicorn

      - name: Run unit tests
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Build Docker image
        run: docker build -t final-project-backend .

      - name: Run container
        run: |
          docker run -d --name ci-backend -p 8000:8000 final-project-backend
          sleep 5

      - name: Test health endpoint
        run: |
          curl --retry 5 --retry-delay 2 -f http://localhost:8000/health

      - name: Tear down
        run: docker rm -f ci-backend
