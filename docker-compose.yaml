version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    networks:
      - app-net
    environment:
      - FRONTEND_URL=http://frontend:80

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx   # on utilise le stage “nginx” pour servir le build React
    ports:
      - "3000:80"
    networks:
      - app-net
    depends_on:
      - ba
    

networks:
  app-net:
    driver: bridge
