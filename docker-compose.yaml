version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    networks:
      - app-net
    # Monte le dossier data/raw de la racine dans /app/data/raw du conteneur
    volumes:
      - ./data/raw:/app/data/raw:ro
    environment:
      - FRONTEND_URL=http://frontend:80
      - MODEL_PATH=/app/model.pth
      - RAW_DIR=/app/data/raw

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "3000:80"
    networks:
      - app-net
    depends_on:
      - backend

networks:
  app-net:
    driver: bridge
